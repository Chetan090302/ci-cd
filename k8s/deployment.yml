
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-similarity
  namespace: ml-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: issue-similarity
  template:
    metadata:
      labels:
        app: issue-similarity
    spec:
      containers:
        - name: api
          image: YOUR_DOCKERHUB_USERNAME/issue-similarity:v1
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: issue-similarity
  namespace: ml-workloads
spec:
  selector:
    app: issue-similarity
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
